name: Publish agent catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install utility dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate utilities
        run: python -m unittest discover -s tests -v

      - name: Generate catalog
        env:
          AGENT_SAMPLES_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}
          AGENT_SAMPLES_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/latest
        run: python scripts/generate_docs.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


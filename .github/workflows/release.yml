name: Build PAF release archives

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paf-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install utility dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Validate source and documentation
        run: |
          python -m unittest discover -s tests -v
          python scripts/generate_docs.py

      - name: Require archive passphrase
        env:
          PAF_ARCHIVE_PASSWORD: ${{ secrets.PAF_ARCHIVE_PASSWORD }}
        run: test -n "$PAF_ARCHIVE_PASSWORD"

      - name: Build and round-trip validate archives
        env:
          PAF_ARCHIVE_PASSWORD: ${{ secrets.PAF_ARCHIVE_PASSWORD }}
        run: python scripts/build_release.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: paf-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Replace rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/* --target "$GITHUB_SHA" --prerelease --title "Latest validated PAF archives" --notes-file dist/RELEASE_NOTES.md

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
